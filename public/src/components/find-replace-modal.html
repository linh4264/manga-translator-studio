<div id="find-replace-modal"
    class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4"
    onclick="closeFindReplaceModal()">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden p-5 space-y-4"
        onclick="event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 rounded bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-magnifying-glass-arrow-right"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-slate-100">Tìm & Thay thế toàn bộ chương</h3>
                    <p class="text-[10px] text-slate-500">Thay đổi hàng loạt từ ngữ/xưng hô trên tất cả các trang
                    </p>
                </div>
            </div>
            <button onclick="closeFindReplaceModal()"
                class="w-8 h-8 rounded hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="space-y-3 text-xs">
            <div class="space-y-1">
                <label class="block font-semibold text-slate-400">Từ / cụm từ cần tìm:</label>
                <input type="text" id="find-input" placeholder="Ví dụ: tôi"
                    class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="space-y-1">
                <label class="block font-semibold text-slate-400">Thay bằng:</label>
                <input type="text" id="replace-input" placeholder="Ví dụ: tớ"
                    class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-slate-400">
                    <input type="checkbox" id="match-case-chk"
                        class="rounded border-slate-800 text-indigo-600 focus:ring-0">
                    <span>Phân biệt chữ HOA / thường</span>
                </label>
                <span id="find-replace-result-badge" class="text-[10px] text-indigo-400 font-semibold"></span>
            </div>
        </div>
        <div class="flex gap-2 pt-2 border-t border-slate-800">
            <button onclick="executeFindReplaceAll()"
                class="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-1.5 transition-all">
                <i class="fa-solid fa-rotate"></i> Thay thế tất cả các trang
            </button>
        </div>
    </div>
</div>
